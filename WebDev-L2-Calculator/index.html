<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <div class="calculator">

            <!-- Calculator header -->
            <div class="calculator-header">
                <span>CALCULATOR</span>
                <span class="status">READY</span>
            </div>


            <!-- Display -->
            <div class="display">

                <div
                    id="expression"
                    class="expression"
                >
                </div>

                <div
                    id="display"
                    class="display-value"
                >
                    0
                </div>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <!-- First row -->
                <button
                    type="button"
                    class="button clear"
                    data-action="clear"
                >
                    C
                </button>

                <button
                    type="button"
                    class="button delete"
                    data-action="delete"
                >
                    DEL
                </button>

                <button
                    type="button"
                    class="button operator"
                    data-operator="/"
                >
                    ÷
                </button>

                <button
                    type="button"
                    class="button operator"
                    data-operator="*"
                >
                    ×
                </button>


                <!-- Second row -->
                <button
                    type="button"
                    class="button number"
                    data-number="7"
                >
                    7
                </button>

                <button
                    type="button"
                    class="button number"
                    data-number="8"
                >
                    8
                </button>

                <button
                    type="button"
                    class="button number"
                    data-number="9"
                >
                    9
                </button>

                <button
                    type="button"
                    class="button operator"
                    data-operator="-"
                >
                    −
                </button>


                <!-- Third row -->
                <button
                    type="button"
                    class="button number"
                    data-number="4"
                >
                    4
                </button>

                <button
                    type="button"
                    class="button number"
                    data-number="5"
                >
                    5
                </button>

                <button
                    type="button"
                    class="button number"
                    data-number="6"
                >
                    6
                </button>

                <button
                    type="button"
                    class="button operator"
                    data-operator="+"
                >
                    +
                </button>


                <!-- Fourth row -->
                <button
                    type="button"
                    class="button number"
                    data-number="1"
                >
                    1
                </button>

                <button
                    type="button"
                    class="button number"
                    data-number="2"
                >
                    2
                </button>

                <button
                    type="button"
                    class="button number"
                    data-number="3"
                >
                    3
                </button>

                <button
                    type="button"
                    class="button equals"
                    data-action="equals"
                >
                    =
                </button>


                <!-- Fifth row -->
                <button
                    type="button"
                    class="button number zero"
                    data-number="0"
                >
                    0
                </button>

                <button
                    type="button"
                    class="button decimal"
                    data-action="decimal"
                >
                    .
                </button>

            </div>

        </div>


        <p class="footer-text">
            Built with HTML, CSS & JavaScript
        </p>

    </main>


    <script src="script.js"></script>

</body>
</html>
